name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AERO_KEYSTORE_BASE64: ${{ secrets.AERO_KEYSTORE_BASE64 }}
      AERO_KEYSTORE_PASSWORD: ${{ secrets.AERO_KEYSTORE_PASSWORD }}
      AERO_KEY_ALIAS: ${{ secrets.AERO_KEY_ALIAS }}
      AERO_KEY_PASSWORD: ${{ secrets.AERO_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on ubuntu-latest)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack source archive
        run: |
          unzip -q AAI-AERO-AI-Source.zip
          cp -a AAI-AERO-AI/. .
          rm -rf AAI-AERO-AI

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Prepare release signing (only if secrets are set)
        if: env.AERO_KEYSTORE_BASE64 != ''
        run: |
          echo "$AERO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AERO_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests, debug and release build
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Collect and verify APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AAI-AERO-AI-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/AAI-AERO-AI-release-signed.apk
            NOTE="Release APK is signed with your keystore."
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/AAI-AERO-AI-release-unsigned.apk
            NOTE="Release APK is UNSIGNED (no signing secrets configured). It cannot be installed or distributed; use the debug APK for testing."
          fi
          for f in dist/*.apk; do
            unzip -Z1 "$f" > "$RUNNER_TEMP/apk-list.txt"
            grep -qx "AndroidManifest.xml" "$RUNNER_TEMP/apk-list.txt"
            grep -qx "classes.dex" "$RUNNER_TEMP/apk-list.txt"
            echo "OK: $f ($(du -h "$f" | cut -f1))"
          done
          {
            echo "### APK build"
            ls -lh dist/*.apk
            echo
            echo "$NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AAI-AERO-AI-debug
          path: dist/AAI-AERO-AI-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AAI-AERO-AI-release
          path: dist/AAI-AERO-AI-release-*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
